  <path d="M 32 18 H 608" stroke="#24394a" stroke-width="2"/>
  <text x="320" y="62" font-size="30" fill="#24394a" font-weight="700" text-anchor="middle">発生には、共通の土台がある</text>
  <text x="320" y="99" font-size="23" fill="#53646c" font-weight="400" text-anchor="middle">ヒトの乳腺発生を簡略化</text>
  <text x="320" y="152" font-size="26" fill="#226e68" font-weight="600" text-anchor="middle">胎児期：乳腺の原基を形成</text>
  <text x="176" y="199" font-size="27" fill="#24394a" font-weight="700" text-anchor="middle">男性</text>
