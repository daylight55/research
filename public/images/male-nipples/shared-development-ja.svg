  <text x="320" y="348" font-size="23" fill="#53646c" font-weight="400" text-anchor="middle">乳管・乳頭も形成</text>
  <rect x="40" y="647" width="560" height="75" rx="5" fill="#eae7dd"/>
  <text x="320" y="678" font-size="25" fill="#24394a" font-weight="600" text-anchor="middle">思春期には乳房の発達に差</text>
  <text x="320" y="708" font-size="22" fill="#53646c" font-weight="400" text-anchor="middle">乳首の有無とは別の変化</text>
  <text x="320" y="760" font-size="21" fill="#53646c" font-weight="400" text-anchor="middle">性の分化と並行する過程の模式図</text>
</svg>
