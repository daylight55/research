<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">Traits can be genetically correlated</title>
  <desc id="desc">Shared genetic effects and positive cross-sex covariance B can yield a positive male trait response to positive female selection, even without direct male selection. This is a general quantitative-trait model, not measured nipple evolution.</desc>
  <defs>
  <marker id="teal-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#226e68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="coral-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#ac4835" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="ink-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#24394a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="muted-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53646c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  </defs>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans', sans-serif; } text { dominant-baseline: auto; }</style>
  <rect width="640" height="760" rx="8" fill="#faf8f2"/>
  <path d="M 32 18 H 608" stroke="#24394a" stroke-width="2"/>
  <text x="320" y="62" font-size="28" fill="#24394a" font-weight="700" text-anchor="middle">Traits can be genetically correlated</text>
  <text x="320" y="101" font-size="23" fill="#53646c" font-weight="400" text-anchor="middle">A general quantitative-trait model</text>
  <path d="M 241 156 C 256 130 266 182 281 156" stroke="#226e68" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 241 156 C 256 182 266 130 281 156" stroke="#ac4835" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 281 156 C 296 130 306 182 321 156" stroke="#226e68" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 281 156 C 296 182 306 130 321 156" stroke="#ac4835" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 321 156 C 336 130 346 182 361 156" stroke="#226e68" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 321 156 C 336 182 346 130 361 156" stroke="#ac4835" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 361 156 C 376 130 386 182 401 156" stroke="#226e68" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 361 156 C 376 182 386 130 401 156" stroke="#ac4835" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="320" y="216" font-size="26" fill="#24394a" font-weight="600" text-anchor="middle">Shared genetic effects</text>
  <path d="M 286 235 C 242 252 165 254 165 302" stroke="#226e68" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 354 235 C 398 252 475 254 475 302" stroke="#ac4835" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="165" cy="358" r="54" fill="#e0ece4" stroke="#226e68" stroke-width="3"/>
  <text x="165" y="369" font-size="34" fill="#226e68" font-weight="600" text-anchor="middle">m</text>
  <text x="165" y="448" font-size="25" fill="#24394a" font-weight="600" text-anchor="middle">Male trait</text>
  <circle cx="475" cy="358" r="54" fill="#f0ddd0" stroke="#ac4835" stroke-width="3"/>
  <text x="475" y="369" font-size="34" fill="#ac4835" font-weight="600" text-anchor="middle">f</text>
  <text x="475" y="448" font-size="25" fill="#24394a" font-weight="600" text-anchor="middle">Female trait</text>
  <path d="M 224 358 H 416" stroke="#b0b7b0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="320" y="323" font-size="30" fill="#24394a" font-weight="600" text-anchor="middle">B &gt; 0</text>
  <text x="320" y="400" font-size="22" fill="#53646c" font-weight="400" text-anchor="middle">Covariance</text>
  <path d="M 475 569 V 486" stroke="#ac4835" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#coral-arrow)"/>
  <path d="M 165 569 V 486" stroke="#226e68" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)" stroke-dasharray="8 8"/>
  <text x="165" y="602" font-size="24" fill="#226e68" font-weight="600" text-anchor="middle">Correlated response</text>
  <text x="475" y="602" font-size="24" fill="#ac4835" font-weight="600" text-anchor="middle">Direct selection</text>
  <text x="165" y="640" font-size="29" fill="#226e68" font-weight="600" text-anchor="middle">Δz̄m &gt; 0</text>
  <text x="475" y="640" font-size="29" fill="#ac4835" font-weight="600" text-anchor="middle">βf &gt; 0</text>
  <text x="320" y="696" font-size="23" fill="#53646c" font-weight="400" text-anchor="middle">Assumption: no direct male selection (βm = 0)</text>
  <text x="320" y="733" font-size="21" fill="#53646c" font-weight="400" text-anchor="middle">Not fitted to measurements of human nipples</text>
</svg>
