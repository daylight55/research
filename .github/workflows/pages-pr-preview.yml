name: Pages PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Astro project
        id: detect
        shell: bash
        run: |
          if [[ -f package.json && -f astro.config.mjs ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.enabled == 'true' && github.event.action != 'closed'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        if: steps.detect.outputs.enabled == 'true' && github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.detect.outputs.enabled == 'true' && github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.detect.outputs.enabled == 'true' && github.event.action != 'closed'
        env:
          ASTRO_SITE: https://${{ github.repository_owner }}.github.io
          ASTRO_BASE: ${{ github.event_name == 'pull_request' && format('/{0}/pr-preview/pr-{1}', github.event.repository.name, github.event.pull_request.number) || format('/{0}', github.event.repository.name) }}
        run: pnpm build

      - name: Publish PR preview
        if: github.event_name == 'pull_request' && (steps.detect.outputs.enabled == 'true' || github.event.action == 'closed')
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          wait-for-pages-deployment: true
          qr-code: false

      - name: Publish main site
        if: steps.detect.outputs.enabled == 'true' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: true

      - name: Comment skipped preview
        if: steps.detect.outputs.enabled != 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pages-preview
          message: |
            GitHub Pages preview was skipped because this branch does not contain an Astro project at the repository root.
