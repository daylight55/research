name: Cloudflare Pages Terraform

on:
  pull_request:
    paths:
      - "infra/cloudflare-pages/**"
      - ".github/workflows/cloudflare-pages-terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/cloudflare-pages/**"
      - ".github/workflows/cloudflare-pages-terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  apply:
    name: Terraform apply
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: cloudflare-pages
    env:
      TF_VAR_account_id: ${{ vars.TF_VAR_CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_project_name: daylight-research
      TF_VAR_github_owner_id: ${{ vars.TF_VAR_GITHUB_OWNER_ID }}
      TF_VAR_github_repo_id: ${{ vars.TF_VAR_GITHUB_REPO_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_KEY: ${{ vars.TF_BACKEND_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    defaults:
      run:
        working-directory: infra/cloudflare-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Write Terraform backend config
        shell: bash
        run: |
          cat > backend.hcl <<EOF
          bucket = "${TF_BACKEND_BUCKET}"
          key    = "${TF_BACKEND_KEY}"
          region = "auto"

          endpoints = {
            s3 = "https://${TF_VAR_account_id}.r2.cloudflarestorage.com"
          }

          access_key = "${R2_ACCESS_KEY_ID}"
          secret_key = "${R2_SECRET_ACCESS_KEY}"

          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_s3_checksum            = true
          EOF

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl

      - name: Import existing Pages project
        shell: bash
        run: |
          if terraform state show cloudflare_pages_project.research >/dev/null 2>&1; then
            echo "Cloudflare Pages project is already managed in Terraform state."
            exit 0
          fi

          if curl --fail --silent --show-error \
            --header "Authorization: Bearer ${TF_VAR_cloudflare_api_token}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${TF_VAR_account_id}/pages/projects/${TF_VAR_project_name}" \
            >/dev/null; then
            terraform import cloudflare_pages_project.research "${TF_VAR_account_id}/${TF_VAR_project_name}"
          else
            echo "Cloudflare Pages project does not exist yet; Terraform will create it."
          fi

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
