name: Daily Issue Research

on:
  schedule:
    # 00:00 JST every day.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional private queue issue number to research immediately"
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: daily-issue-research
  cancel-in-progress: false

env:
  RESEARCH_REPOSITORY: research
  RESEARCH_QUEUE_REPOSITORY: daylight55/research-queue
  RESEARCH_READY_LABEL: daily-research
  RESEARCH_QUEUE_APP_ID: ${{ secrets.RESEARCH_QUEUE_APP_ID }}
  RESEARCH_QUEUE_APP_PRIVATE_KEY: ${{ secrets.RESEARCH_QUEUE_APP_PRIVATE_KEY }}
  OPENAI_MODEL: gpt-5.4-mini

jobs:
  research:
    runs-on: ubuntu-latest
    environment: codex-production
    outputs:
      issue_found: ${{ steps.select_issue.outputs.issue_found }}
      issue_number: ${{ steps.select_issue.outputs.issue_number }}
      pr_url: ${{ steps.create_pr.outputs.pr_url }}
      pr_number: ${{ steps.create_pr.outputs.pr_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check research queue app configuration
        id: queue_app_config
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RESEARCH_QUEUE_APP_ID}" || -z "${RESEARCH_QUEUE_APP_PRIVATE_KEY}" ]]; then
            echo "::warning::Research queue GitHub App secrets are not configured. Set RESEARCH_QUEUE_APP_ID and RESEARCH_QUEUE_APP_PRIVATE_KEY to enable private queue issue processing."
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "configured=true" >> "${GITHUB_OUTPUT}"

      - name: Create research queue token
        if: steps.queue_app_config.outputs.configured == 'true'
        id: queue_app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.RESEARCH_QUEUE_APP_ID }}
          private-key: ${{ env.RESEARCH_QUEUE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: research-queue

      - name: Create research repository token
        if: steps.queue_app_config.outputs.configured == 'true'
        id: research_app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.RESEARCH_QUEUE_APP_ID }}
          private-key: ${{ env.RESEARCH_QUEUE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.RESEARCH_REPOSITORY }}

      - name: Select research issue
        if: steps.queue_app_config.outputs.configured == 'true'
        id: select_issue
        shell: bash
        env:
          GH_TOKEN: ${{ steps.queue_app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || '' }}
          RESEARCH_QUEUE_REPOSITORY: ${{ env.RESEARCH_QUEUE_REPOSITORY }}
          RESEARCH_READY_LABEL: ${{ env.RESEARCH_READY_LABEL }}
        run: |
          set -euo pipefail

          mkdir -p ops/codex/runtime

          if [[ -n "${ISSUE_NUMBER}" ]]; then
            gh issue view "${ISSUE_NUMBER}" \
              --repo "${RESEARCH_QUEUE_REPOSITORY}" \
              --json number,title,body,labels,url,state \
              > ops/codex/runtime/selected-issue.json
          else
            gh issue list \
              --repo "${RESEARCH_QUEUE_REPOSITORY}" \
              --state open \
              --json number,title,body,labels,url,createdAt,updatedAt \
              --limit 100 \
              | jq --arg ready_label "${RESEARCH_READY_LABEL}" 'map(select(([.labels[].name] | index($ready_label)) and ([.labels[].name] | index("research-pr-opened") | not) and ([.labels[].name] | index("research-skip") | not))) | sort_by(.createdAt, .number) | .[0] // empty' \
              > ops/codex/runtime/selected-issue.json
          fi

          if [[ ! -s ops/codex/runtime/selected-issue.json ]] || [[ "$(cat ops/codex/runtime/selected-issue.json)" == "null" ]]; then
            echo "issue_found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! jq -e --arg ready_label "${RESEARCH_READY_LABEL}" '[.labels[].name] | index($ready_label)' ops/codex/runtime/selected-issue.json >/dev/null; then
            echo "Issue is missing required label: ${RESEARCH_READY_LABEL}"
            echo "issue_found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          issue_number="$(jq -r '.number' ops/codex/runtime/selected-issue.json)"
          issue_title="$(jq -r '.title' ops/codex/runtime/selected-issue.json)"

          {
            echo "issue_found=true"
            echo "issue_number=${issue_number}"
            echo "issue_title<<EOF"
            echo "${issue_title}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Compose Codex prompt
        if: steps.select_issue.outputs.issue_found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cp ops/codex/prompts/daily-issue-research.md ops/codex/runtime/daily-research-prompt.md

          {
            echo
            echo "## Selected Issue Context"
            echo
            jq -r '"- Issue: #\(.number) \(.title)\n- Labels: \([.labels[].name] | join(", "))"' ops/codex/runtime/selected-issue.json
            echo
            echo "### Issue Body"
            echo
            jq -r '.body // "(no body)"' ops/codex/runtime/selected-issue.json
            echo
            echo "## Automation Metadata"
            echo
            echo "- Model: ${OPENAI_MODEL}"
            echo "- Required skill: [research-report](https://github.com/${GITHUB_REPOSITORY}/blob/main/.codex/skills/research-report/SKILL.md)"
            echo "- Prompt source: [ops/codex/prompts/daily-issue-research.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/ops/codex/prompts/daily-issue-research.md)"
          } >> ops/codex/runtime/daily-research-prompt.md

      - name: Record Daily CI start time
        if: steps.select_issue.outputs.issue_found == 'true'
        id: daily_ci_time
        shell: bash
        run: |
          {
            echo "start_epoch=$(date +%s)"
            echo "start_iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup pnpm
        if: steps.select_issue.outputs.issue_found == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        if: steps.select_issue.outputs.issue_found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.select_issue.outputs.issue_found == 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore cached generated article
        if: steps.select_issue.outputs.issue_found == 'true'
        id: restore_generated_article
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/generated-article-cache
          key: daily-issue-research-${{ steps.select_issue.outputs.issue_number }}

      - name: Apply cached generated article
        if: steps.restore_generated_article.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail

          tar -xzf "${RUNNER_TEMP}/generated-article-cache/generated-article.tar.gz" -C .

      - name: Record OpenAI usage window
        if: steps.select_issue.outputs.issue_found == 'true' && steps.restore_generated_article.outputs.cache-hit != 'true'
        id: openai_usage_window
        shell: bash
        run: |
          echo "start_time=$(date +%s)" >> "${GITHUB_OUTPUT}"

      - name: Run Codex research
        if: steps.select_issue.outputs.issue_found == 'true' && steps.restore_generated_article.outputs.cache-hit != 'true'
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ops/codex/runtime/daily-research-prompt.md
          output-file: codex-output.md
          safety-strategy: drop-sudo
          sandbox: workspace-write
          model: ${{ env.OPENAI_MODEL }}
          effort: medium
          allow-bots: true

      - name: Restore Node for site build
        if: steps.select_issue.outputs.issue_found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Estimate OpenAI usage cost
        if: always() && steps.select_issue.outputs.issue_found == 'true' && steps.restore_generated_article.outputs.cache-hit != 'true'
        continue-on-error: true
        id: openai_usage_cost
        shell: bash
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          OPENAI_USAGE_START_TIME: ${{ steps.openai_usage_window.outputs.start_time }}
          OPENAI_USAGE_MODEL: ${{ env.OPENAI_MODEL }}
          OPENAI_USAGE_OUTPUT_FILE: ${{ runner.temp }}/openai-usage-comment.md
        run: |
          set -euo pipefail

          OPENAI_USAGE_END_TIME="$(date +%s)"
          export OPENAI_USAGE_END_TIME
          node ops/scripts/estimate-openai-usage-cost.mjs
          echo "comment_path=${OPENAI_USAGE_OUTPUT_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Remove runtime prompt artifacts
        if: always()
        shell: bash
        run: |
          rm -rf ops/codex/runtime codex-output.md

      - name: Check generated diff
        if: steps.select_issue.outputs.issue_found == 'true'
        id: diff_check
        shell: bash
        run: |
          set -euo pipefail

          git ls-files --modified --others --exclude-standard -z -- '*.md' '*.mdx' \
            | while IFS= read -r -d '' file; do
                perl -0pi -e 's/[ \t]+$//mg; s/\n+\z/\n/s' "${file}"
              done

          # Include newly created files in diff checks without staging contents.
          git add --intent-to-add .
          git diff --check

          mapfile -t changed_blog_entries < <(git ls-files --modified --others --exclude-standard -- 'articles/report/*/ja/index.mdx' || true)
          if (( ${#changed_blog_entries[@]} > 0 )) \
            && grep -nE "import[[:space:]]+.*report\\.md|<Report[[:space:]]*/>" -- "${changed_blog_entries[@]}"; then
            echo "::error::Site entries must copy the report body directly into articles/report/*/ja/index.mdx. Do not import a separate report body, because imported Markdown headings are not available to the article sidebar."
            exit 1
          fi

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
          else
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Select Unsplash hero images
        if: steps.diff_check.outputs.has_changes == 'true' && steps.restore_generated_article.outputs.cache-hit != 'true'
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node ops/scripts/select-unsplash-hero.mjs

      - name: Verify unique hero images
        if: steps.diff_check.outputs.has_changes == 'true'
        run: pnpm test:hero-images

      - name: Verify generated mixed article alignment
        if: steps.diff_check.outputs.has_changes == 'true'
        run: node ops/scripts/validate-mix-alignment.mjs --changed

      - name: Build generated site
        if: steps.diff_check.outputs.has_changes == 'true'
        run: pnpm build

      - name: Create generated article cache archive
        if: steps.diff_check.outputs.has_changes == 'true' && steps.restore_generated_article.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/generated-article-cache"
          generated_files="${RUNNER_TEMP}/generated-files.txt"
          git ls-files --modified --others --exclude-standard -z \
            > "${generated_files}"
          tar --null -czf "${RUNNER_TEMP}/generated-article-cache/generated-article.tar.gz" \
            --files-from "${generated_files}"

      - name: Save generated article cache
        if: steps.diff_check.outputs.has_changes == 'true' && steps.restore_generated_article.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/generated-article-cache
          key: daily-issue-research-${{ steps.select_issue.outputs.issue_number }}

      - name: Create research pull request
        if: steps.diff_check.outputs.has_changes == 'true'
        id: create_pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_GH_TOKEN: ${{ steps.research_app_token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.select_issue.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.select_issue.outputs.issue_title }}
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
          GENERATED_ARTICLE_CACHE_HIT: ${{ steps.restore_generated_article.outputs.cache-hit }}
          DAILY_CI_START_EPOCH: ${{ steps.daily_ci_time.outputs.start_epoch }}
          DAILY_CI_START_ISO: ${{ steps.daily_ci_time.outputs.start_iso }}
        run: |
          set -euo pipefail

          branch="codex/daily-research-${GITHUB_RUN_ID}"
          base_ref_oid="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add -A
          git commit -m "Add daily research report"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${branch}" \
            -f sha="${base_ref_oid}" \
            >/dev/null
          git push origin "HEAD:${branch}"

          daily_ci_end_epoch="$(date +%s)"
          daily_ci_end_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          daily_ci_elapsed_seconds="$((daily_ci_end_epoch - DAILY_CI_START_EPOCH))"
          daily_ci_elapsed_minutes="$((daily_ci_elapsed_seconds / 60))"
          daily_ci_elapsed_remaining_seconds="$((daily_ci_elapsed_seconds % 60))"

          pr_body="$(mktemp)"
          {
            echo "Daily Codex research run for: ${ISSUE_TITLE}"
            echo
            echo "## Daily CI execution time"
            echo
            printf -- "- Elapsed: %dm %02ds (%d seconds)\n" "${daily_ci_elapsed_minutes}" "${daily_ci_elapsed_remaining_seconds}" "${daily_ci_elapsed_seconds}"
            echo "- Started: ${DAILY_CI_START_ISO}"
            echo "- Finished: ${daily_ci_end_iso}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## Codex summary"
            echo
            if [[ "${GENERATED_ARTICLE_CACHE_HIT}" == "true" ]]; then
              echo "Generated article artifacts were restored from the issue cache, so Codex generation was skipped."
            elif [[ -n "${CODEX_FINAL_MESSAGE}" ]]; then
              echo "${CODEX_FINAL_MESSAGE}"
            else
              echo "Codex did not return a final message."
            fi
          } > "${pr_body}"

          pr_url="$(GH_TOKEN="${PR_GH_TOKEN}" gh pr create \
            --title "Daily research: ${ISSUE_TITLE}" \
            --body-file "${pr_body}" \
            --base main \
            --head "${branch}")"
          pr_number="$(GH_TOKEN="${PR_GH_TOKEN}" gh pr view "${pr_url}" --json number --jq '.number')"

          {
            echo "pr_url=${pr_url}"
            echo "pr_number=${pr_number}"
            echo "branch=${branch}"
            echo "base_ref_oid=${base_ref_oid}"
          } >> "${GITHUB_OUTPUT}"

      - name: Comment OpenAI usage on PR
        if: steps.create_pr.outputs.pr_url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.research_app_token.outputs.token }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
          OPENAI_USAGE_COMMENT: ${{ steps.openai_usage_cost.outputs.comment_path }}
        run: |
          set -euo pipefail

          if [[ -s "${OPENAI_USAGE_COMMENT}" ]]; then
            gh pr comment "${PR_URL}" --body-file "${OPENAI_USAGE_COMMENT}"
          fi

      - name: Dispatch Cloudflare preview deploy
        if: steps.create_pr.outputs.pr_url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.research_app_token.outputs.token }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          PREVIEW_BRANCH: ${{ steps.create_pr.outputs.branch }}
        run: |
          set -euo pipefail

          gh workflow run cloudflare-pages-preview.yml \
            --ref main \
            -f pr_number="${PR_NUMBER}" \
            -f preview_branch="${PREVIEW_BRANCH}" \
            -f checkout_ref="${PREVIEW_BRANCH}"

      - name: Mark issue with PR
        if: steps.create_pr.outputs.pr_url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.queue_app_token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.select_issue.outputs.issue_number }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
          RESEARCH_QUEUE_REPOSITORY: ${{ env.RESEARCH_QUEUE_REPOSITORY }}
        run: |
          set -euo pipefail

          gh label create research-pr-opened \
            --repo "${RESEARCH_QUEUE_REPOSITORY}" \
            --description "A daily Codex research PR has been opened for this issue" \
            --color "0E8A16" \
            --force

          gh issue edit "${ISSUE_NUMBER}" \
            --repo "${RESEARCH_QUEUE_REPOSITORY}" \
            --add-label research-pr-opened
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${RESEARCH_QUEUE_REPOSITORY}" \
            --body "Daily Codex research PR opened: ${PR_URL}"

      - name: Merge completed research pull request
        if: steps.create_pr.outputs.pr_url != ''
        id: merge_pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.research_app_token.outputs.token }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          ISSUE_NUMBER: ${{ steps.select_issue.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.select_issue.outputs.issue_title }}
          EXPECTED_BASE_REF_OID: ${{ steps.create_pr.outputs.base_ref_oid }}
        run: |
          set -euo pipefail

          pr_json="$(gh pr view "${PR_NUMBER}" --json state,headRefOid)"
          pr_state="$(jq -r '.state' <<< "${pr_json}")"
          head_ref_oid="$(jq -r '.headRefOid' <<< "${pr_json}")"
          current_main_ref_oid="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"

          if [[ "${pr_state}" != "OPEN" ]]; then
            if [[ "${pr_state}" == "MERGED" ]]; then
              echo "PR #${PR_NUMBER} is already merged."
              exit 0
            else
              echo "::error::PR #${PR_NUMBER} is not open; current state is ${pr_state}."
              exit 1
            fi
          fi

          if [[ "${current_main_ref_oid}" != "${EXPECTED_BASE_REF_OID}" ]]; then
            echo "::error::main changed from ${EXPECTED_BASE_REF_OID} to ${current_main_ref_oid} after generation and preview. Re-run the workflow on the latest main before merging PR #${PR_NUMBER}."
            exit 1
          fi

          gh pr merge "${PR_NUMBER}" \
            --squash \
            --delete-branch \
            --match-head-commit "${head_ref_oid}" \
            --subject "Daily research: ${ISSUE_TITLE}" \
            --body "Generated, built, and merged by the Daily Issue Research workflow."

      - name: Comment merged PR on queue issue
        if: steps.merge_pr.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.queue_app_token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.select_issue.outputs.issue_number }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          RESEARCH_QUEUE_REPOSITORY: ${{ env.RESEARCH_QUEUE_REPOSITORY }}
        run: |
          set -euo pipefail

          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${RESEARCH_QUEUE_REPOSITORY}" \
            --body "Daily Codex research PR #${PR_NUMBER} was built and merged into main."

      - name: Close completed research issue
        if: steps.merge_pr.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.queue_app_token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.select_issue.outputs.issue_number }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          RESEARCH_QUEUE_REPOSITORY: ${{ env.RESEARCH_QUEUE_REPOSITORY }}
        run: |
          set -euo pipefail

          issue_state="$(gh issue view "${ISSUE_NUMBER}" \
            --repo "${RESEARCH_QUEUE_REPOSITORY}" \
            --json state \
            --jq '.state')"
          if [[ "${issue_state}" == "OPEN" ]]; then
            gh issue close "${ISSUE_NUMBER}" \
              --repo "${RESEARCH_QUEUE_REPOSITORY}" \
              --reason completed \
              --comment "Closing because daily Codex research PR #${PR_NUMBER} was merged into main."
          else
            echo "Issue #${ISSUE_NUMBER} is already ${issue_state}; no close action needed."
          fi

      - name: Dispatch Cloudflare production deploy
        if: steps.merge_pr.outcome == 'success'
        id: dispatch_production_deploy
        shell: bash
        env:
          GH_TOKEN: ${{ steps.research_app_token.outputs.token }}
        run: |
          set -euo pipefail

          dispatch_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          gh workflow run cloudflare-pages-deploy.yml --ref main

          deploy_run_id=""
          for _ in {1..30}; do
            deploy_run_id="$(gh run list \
              --workflow cloudflare-pages-deploy.yml \
              --branch main \
              --event workflow_dispatch \
              --json databaseId,createdAt,status \
              --jq 'map(select(.createdAt >= "'"${dispatch_started_at}"'")) | sort_by(.createdAt) | reverse | .[0].databaseId // ""')"

            if [[ -n "${deploy_run_id}" ]]; then
              break
            fi

            sleep 5
          done

          if [[ -z "${deploy_run_id}" ]]; then
            echo "::error::Could not find dispatched Cloudflare Pages production deploy run."
            exit 1
          fi

          echo "deploy_run_id=${deploy_run_id}" >> "${GITHUB_OUTPUT}"

      - name: Wait for Cloudflare production deploy
        if: steps.dispatch_production_deploy.outputs.deploy_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.research_app_token.outputs.token }}
          DEPLOY_RUN_ID: ${{ steps.dispatch_production_deploy.outputs.deploy_run_id }}
        run: |
          set -euo pipefail

          gh run watch "${DEPLOY_RUN_ID}" --exit-status --interval 10

      - name: Comment when no issue was selected
        if: steps.queue_app_config.outputs.configured == 'true' && steps.select_issue.outputs.issue_found == 'false'
        run: |
          echo "No open issue matched the configured daily research labels. Add the daily-research label to explicitly allow automated research."

      - name: Comment when Codex produced no diff
        if: steps.select_issue.outputs.issue_found == 'true' && steps.diff_check.outputs.has_changes == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.queue_app_token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.select_issue.outputs.issue_number }}
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
          RESEARCH_QUEUE_REPOSITORY: ${{ env.RESEARCH_QUEUE_REPOSITORY }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${RESEARCH_QUEUE_REPOSITORY}" \
            --body "Daily Codex research ran, but no repository changes were produced.

          ${CODEX_FINAL_MESSAGE}"
