<svg xmlns="http://www.w3.org/2000/svg" width="640" height="838" viewBox="0 0 640 838" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">Cells generate force to shape tissue</title>
  <desc id="desc">An original schematic based on mouse mammary-bud research. Above: cell influx from surrounding epithelium. Below: contraction of epidermal ring cells around the bud and invagination into mesenchyme. Arrows are not measured forces or velocities.</desc>
  <defs>
  <marker id="teal-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#226e68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="coral-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#ac4835" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="ink-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#24394a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="muted-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53646c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  </defs>
