  <text x="543" y="705" font-size="21" fill="#53646c" font-weight="400" text-anchor="end">間葉</text>
  <text x="320" y="770" font-size="23" fill="#24394a" font-weight="600" text-anchor="middle">細胞の流入と収縮が、組織の形を変える</text>
  <text x="320" y="809" font-size="21" fill="#53646c" font-weight="400" text-anchor="middle">ヒト男性での乳頭保持を示す図ではない</text>
</svg>
