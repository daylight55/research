name: Daily Issue Research

on:
  schedule:
    # 00:00 JST every day.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue number to research immediately"
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: daily-issue-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    outputs:
      issue_found: ${{ steps.select_issue.outputs.issue_found }}
      issue_number: ${{ steps.select_issue.outputs.issue_number }}
      pr_url: ${{ steps.create_pr.outputs.pr_url }}
      pr_number: ${{ steps.create_pr.outputs.pr_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select research issue
        id: select_issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || '' }}
        run: |
          set -euo pipefail

          mkdir -p .github/codex/runtime

          if [[ -n "${ISSUE_NUMBER}" ]]; then
            gh issue view "${ISSUE_NUMBER}" \
              --json number,title,body,labels,url,state \
              > .github/codex/runtime/selected-issue.json
          else
            gh issue list \
              --state open \
              --json number,title,body,labels,url,createdAt,updatedAt \
              --limit 100 \
              | jq 'map(select(([.labels[].name] | index("research-pr-opened") | not) and ([.labels[].name] | index("research-skip") | not))) | sort_by(.createdAt, .number) | .[0] // empty' \
              > .github/codex/runtime/selected-issue.json
          fi

          if [[ ! -s .github/codex/runtime/selected-issue.json ]] || [[ "$(cat .github/codex/runtime/selected-issue.json)" == "null" ]]; then
            echo "issue_found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          issue_number="$(jq -r '.number' .github/codex/runtime/selected-issue.json)"
          issue_title="$(jq -r '.title' .github/codex/runtime/selected-issue.json)"

          echo "issue_found=true" >> "${GITHUB_OUTPUT}"
          echo "issue_number=${issue_number}" >> "${GITHUB_OUTPUT}"
          {
            echo "issue_title<<EOF"
            echo "${issue_title}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Compose Codex prompt
        if: steps.select_issue.outputs.issue_found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cp .github/codex/prompts/daily-issue-research.md .github/codex/runtime/daily-research-prompt.md

          {
            echo
            echo "## Selected Issue Context"
            echo
            jq -r '"- Issue: #\(.number) \(.title)\n- URL: \(.url)\n- Labels: \([.labels[].name] | join(", "))"' .github/codex/runtime/selected-issue.json
            echo
            echo "### Issue Body"
            echo
            jq -r '.body // "(no body)"' .github/codex/runtime/selected-issue.json
          } >> .github/codex/runtime/daily-research-prompt.md

      - name: Setup pnpm
        if: steps.select_issue.outputs.issue_found == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        if: steps.select_issue.outputs.issue_found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.select_issue.outputs.issue_found == 'true'
        run: pnpm install --frozen-lockfile

      - name: Record OpenAI usage window
        if: steps.select_issue.outputs.issue_found == 'true'
        id: openai_usage_window
        shell: bash
        run: |
          echo "start_time=$(date +%s)" >> "${GITHUB_OUTPUT}"

      - name: Run Codex research
        if: steps.select_issue.outputs.issue_found == 'true'
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/runtime/daily-research-prompt.md
          output-file: codex-output.md
          safety-strategy: drop-sudo
          sandbox: workspace-write
          model: gpt-5.4-mini
          effort: medium
          allow-bots: true

      - name: Estimate OpenAI usage cost
        if: always() && steps.select_issue.outputs.issue_found == 'true'
        continue-on-error: true
        id: openai_usage_cost
        shell: bash
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          OPENAI_USAGE_START_TIME: ${{ steps.openai_usage_window.outputs.start_time }}
          OPENAI_USAGE_MODEL: gpt-5.4-mini
          OPENAI_USAGE_OUTPUT_FILE: ${{ runner.temp }}/openai-usage-comment.md
        run: |
          set -euo pipefail

          export OPENAI_USAGE_END_TIME="$(date +%s)"
          node .github/scripts/estimate-openai-usage-cost.mjs
          echo "comment_path=${OPENAI_USAGE_OUTPUT_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Remove runtime prompt artifacts
        if: always()
        shell: bash
        run: |
          rm -rf .github/codex/runtime codex-output.md

      - name: Check generated diff
        if: steps.select_issue.outputs.issue_found == 'true'
        id: diff_check
        shell: bash
        run: |
          set -euo pipefail

          git ls-files --modified --others --exclude-standard -z -- '*.md' '*.mdx' \
            | while IFS= read -r -d '' file; do
                perl -0pi -e 's/[ \t]+$//mg; s/\n+\z/\n/s' "${file}"
              done

          # Include newly created files in diff checks without staging contents.
          git add --intent-to-add .
          git diff --check

          changed_blog_entries="$(git ls-files --modified --others --exclude-standard -- 'src/content/blog/*.mdx' || true)"
          if [[ -n "${changed_blog_entries}" ]] \
            && grep -nE "import[[:space:]]+.*from[[:space:]]+['\"]\\.\\./\\.\\./\\.\\./category/|<Report[[:space:]]*/>" ${changed_blog_entries}; then
            echo "::error::Site entries must copy the report body directly into src/content/blog/*.mdx. Do not import category/.../report.md, because imported Markdown headings are not available to the article sidebar."
            exit 1
          fi

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
          else
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Select Unsplash hero images
        if: steps.diff_check.outputs.has_changes == 'true'
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node .github/scripts/select-unsplash-hero.mjs

      - name: Build generated site
        if: steps.diff_check.outputs.has_changes == 'true'
        run: pnpm build

      - name: Create research pull request
        if: steps.diff_check.outputs.has_changes == 'true'
        id: create_pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.select_issue.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.select_issue.outputs.issue_title }}
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        run: |
          set -euo pipefail

          branch="codex/daily-research-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          base_ref_oid="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add -A
          git commit -m "Add daily research report for issue #${ISSUE_NUMBER}"
          git push origin "${branch}"

          pr_body="$(mktemp)"
          {
            echo "Closes #${ISSUE_NUMBER}"
            echo
            echo "Daily Codex research run for: ${ISSUE_TITLE}"
            echo
            echo "## Codex summary"
            echo
            if [[ -n "${CODEX_FINAL_MESSAGE}" ]]; then
              echo "${CODEX_FINAL_MESSAGE}"
            else
              echo "Codex did not return a final message."
            fi
          } > "${pr_body}"

          pr_url="$(gh pr create \
            --title "Daily research: #${ISSUE_NUMBER} ${ISSUE_TITLE}" \
            --body-file "${pr_body}" \
            --base main \
            --head "${branch}")"
          pr_number="$(gh pr view "${pr_url}" --json number --jq '.number')"

          echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "base_ref_oid=${base_ref_oid}" >> "${GITHUB_OUTPUT}"

      - name: Comment OpenAI usage on PR
        if: steps.create_pr.outputs.pr_url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
          OPENAI_USAGE_COMMENT: ${{ steps.openai_usage_cost.outputs.comment_path }}
        run: |
          set -euo pipefail

          if [[ -s "${OPENAI_USAGE_COMMENT}" ]]; then
            gh pr comment "${PR_URL}" --body-file "${OPENAI_USAGE_COMMENT}"
          fi

      - name: Mark issue with PR
        if: steps.create_pr.outputs.pr_url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.select_issue.outputs.issue_number }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
        run: |
          set -euo pipefail

          gh label create research-pr-opened \
            --description "A daily Codex research PR has been opened for this issue" \
            --color "0E8A16" \
            --force

          gh issue edit "${ISSUE_NUMBER}" --add-label research-pr-opened
          gh issue comment "${ISSUE_NUMBER}" --body "Daily Codex research PR opened: ${PR_URL}"

      - name: Merge completed research pull request
        if: steps.create_pr.outputs.pr_url != ''
        id: merge_pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          ISSUE_NUMBER: ${{ steps.select_issue.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.select_issue.outputs.issue_title }}
          EXPECTED_BASE_REF_OID: ${{ steps.create_pr.outputs.base_ref_oid }}
        run: |
          set -euo pipefail

          pr_json="$(gh pr view "${PR_NUMBER}" --json state,headRefOid)"
          pr_state="$(jq -r '.state' <<< "${pr_json}")"
          head_ref_oid="$(jq -r '.headRefOid' <<< "${pr_json}")"
          current_main_ref_oid="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq '.object.sha')"

          if [[ "${pr_state}" != "OPEN" ]]; then
            if [[ "${pr_state}" == "MERGED" ]]; then
              echo "PR #${PR_NUMBER} is already merged."
              exit 0
            else
              echo "::error::PR #${PR_NUMBER} is not open; current state is ${pr_state}."
              exit 1
            fi
          fi

          if [[ "${current_main_ref_oid}" != "${EXPECTED_BASE_REF_OID}" ]]; then
            echo "::error::main changed from ${EXPECTED_BASE_REF_OID} to ${current_main_ref_oid} after generation and preview. Re-run the workflow on the latest main before merging PR #${PR_NUMBER}."
            exit 1
          fi

          gh pr merge "${PR_NUMBER}" \
            --squash \
            --delete-branch \
            --match-head-commit "${head_ref_oid}" \
            --subject "Daily research: #${ISSUE_NUMBER} ${ISSUE_TITLE}" \
            --body "Generated, built, and merged by the Daily Issue Research workflow."

          gh issue comment "${ISSUE_NUMBER}" --body "Daily Codex research PR #${PR_NUMBER} was built and merged into main."

      - name: Dispatch Cloudflare production deploy
        if: steps.merge_pr.outcome == 'success'
        id: dispatch_production_deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          dispatch_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          gh workflow run cloudflare-pages-deploy.yml --ref main

          deploy_run_id=""
          for _ in {1..30}; do
            deploy_run_id="$(gh run list \
              --workflow cloudflare-pages-deploy.yml \
              --branch main \
              --event workflow_dispatch \
              --json databaseId,createdAt,status \
              --jq 'map(select(.createdAt >= "'"${dispatch_started_at}"'")) | sort_by(.createdAt) | reverse | .[0].databaseId // ""')"

            if [[ -n "${deploy_run_id}" ]]; then
              break
            fi

            sleep 5
          done

          if [[ -z "${deploy_run_id}" ]]; then
            echo "::error::Could not find dispatched Cloudflare Pages production deploy run."
            exit 1
          fi

          echo "deploy_run_id=${deploy_run_id}" >> "${GITHUB_OUTPUT}"

      - name: Wait for Cloudflare production deploy
        if: steps.dispatch_production_deploy.outputs.deploy_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ steps.dispatch_production_deploy.outputs.deploy_run_id }}
        run: |
          set -euo pipefail

          gh run watch "${DEPLOY_RUN_ID}" --exit-status --interval 10

      - name: Comment when no issue was selected
        if: steps.select_issue.outputs.issue_found == 'false'
        run: |
          echo "No open issue matched the configured daily research labels."

      - name: Comment when Codex produced no diff
        if: steps.select_issue.outputs.issue_found == 'true' && steps.diff_check.outputs.has_changes == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.select_issue.outputs.issue_number }}
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --body "Daily Codex research ran, but no repository changes were produced.

          ${CODEX_FINAL_MESSAGE}"
