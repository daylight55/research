  <title id="title">ひとつの乳首、4つの問い</title>
  <desc id="desc">発生は個体の形成、進化は世代間の保持、働きは現在の感覚や分泌、意味は社会の規範と本人の経験を問う。四つは同じ身体に向けた異なる問いで、因果の順番ではない。</desc>
