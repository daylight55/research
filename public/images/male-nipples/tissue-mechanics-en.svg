  <text x="320" y="770" font-size="23" fill="#24394a" font-weight="600" text-anchor="middle">Cell influx and contraction change tissue shape</text>
  <text x="320" y="809" font-size="21" fill="#53646c" font-weight="400" text-anchor="middle">Not a mechanism of human male nipple retention</text>
