  <text x="320" y="102" font-size="23" fill="#53646c" font-weight="400" text-anchor="middle">マウス乳腺芽研究の模式図</text>
  <text x="40" y="161" font-size="26" fill="#226e68" font-weight="600" text-anchor="start">成長：周囲から細胞が集まる</text>
