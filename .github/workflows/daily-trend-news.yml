name: Daily Trend News

on:
  schedule:
    # 06:00 JST every day.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional research date in YYYY-MM-DD. Defaults to today's date in JST."
        required: false
        type: string
      topic_hint:
        description: "Optional extra focus for this run."
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: daily-trend-news
  cancel-in-progress: false

env:
  RESEARCH_REPOSITORY: research
  RESEARCH_QUEUE_APP_ID: ${{ secrets.RESEARCH_QUEUE_APP_ID }}
  RESEARCH_QUEUE_APP_PRIVATE_KEY: ${{ secrets.RESEARCH_QUEUE_APP_PRIVATE_KEY }}
  NEWS_CATEGORY: tech-news
  OPENAI_MODEL: gpt-5.4-mini

jobs:
  trend-news:
    runs-on: ubuntu-latest
    environment: codex-production
    outputs:
      pr_url: ${{ steps.create_pr.outputs.pr_url }}
      pr_number: ${{ steps.create_pr.outputs.pr_number }}
      report_date: ${{ steps.run_context.outputs.report_date }}
      slug: ${{ steps.run_context.outputs.slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check research app configuration
        id: research_app_config
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RESEARCH_QUEUE_APP_ID}" || -z "${RESEARCH_QUEUE_APP_PRIVATE_KEY}" ]]; then
            echo "::error::Research GitHub App secrets are not configured. Set RESEARCH_QUEUE_APP_ID and RESEARCH_QUEUE_APP_PRIVATE_KEY before creating daily trend PRs."
            exit 1
          fi

      - name: Create research repository token
        id: research_app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.RESEARCH_QUEUE_APP_ID }}
          private-key: ${{ env.RESEARCH_QUEUE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.RESEARCH_REPOSITORY }}

      - name: Prepare run context
        id: run_context
        shell: bash
        env:
          INPUT_REPORT_DATE: ${{ github.event.inputs.report_date || '' }}
          TOPIC_HINT: ${{ github.event.inputs.topic_hint || '' }}
        run: |
          set -euo pipefail

          mkdir -p ops/codex/runtime

          if [[ -n "${INPUT_REPORT_DATE}" ]]; then
            report_date="${INPUT_REPORT_DATE}"
          else
            report_date="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          fi

          if ! [[ "${report_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::report_date must be in YYYY-MM-DD format."
            exit 1
          fi

          slug="daily-trends-${report_date}"
          article_path="articles/news/${slug}/ja/index.mdx"
          topic_hint_hash=""
          article_exists=false
          cache_key="daily-trend-news-${report_date}"
          if [[ -n "${TOPIC_HINT}" ]]; then
            topic_hint_hash="$(printf '%s' "${TOPIC_HINT}" | sha256sum | cut -d' ' -f1 | cut -c1-12)"
            cache_key="${cache_key}-${topic_hint_hash}"
          fi

          if [[ -e "${article_path}" ]]; then
            article_exists=true
            echo "::notice::News article already exists for ${report_date}: ${article_path}. Skipping Codex generation and validating the existing article."
          fi

          {
            echo "report_date=${report_date}"
            echo "slug=${slug}"
            echo "article_path=${article_path}"
            echo "article_exists=${article_exists}"
            echo "cache_key=${cache_key}"
          } >> "${GITHUB_OUTPUT}"

          cp ops/codex/prompts/daily-trend-news.md ops/codex/runtime/daily-trend-news-prompt.md

          {
            echo
            echo "## Run Context"
            echo
            echo "- Research date: ${report_date}"
            echo "- Article slug: ${slug}"
            echo "- Article path: ${article_path}"
            echo "- Required category: ${NEWS_CATEGORY}"
            echo "- Required content type: news"
            echo "- Required topic counts: politics 5, economy 5, technology 5"
            if [[ -n "${TOPIC_HINT}" ]]; then
              echo "- Extra focus: ${TOPIC_HINT}"
            fi
            echo
            echo "## Automation Metadata"
            echo
            echo "- Model: ${OPENAI_MODEL}"
            echo "- Prompt source: [ops/codex/prompts/daily-trend-news.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/ops/codex/prompts/daily-trend-news.md)"
          } >> ops/codex/runtime/daily-trend-news-prompt.md

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore cached generated news article
        id: restore_generated_news_article
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/generated-news-article-cache
          key: ${{ steps.run_context.outputs.cache_key }}

      - name: Apply cached generated news article
        if: steps.run_context.outputs.article_exists != 'true' && steps.restore_generated_news_article.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail

          tar -xzf "${RUNNER_TEMP}/generated-news-article-cache/generated-news-article.tar.gz" -C .

      - name: Record OpenAI usage window
        if: steps.run_context.outputs.article_exists != 'true' && steps.restore_generated_news_article.outputs.cache-hit != 'true'
        id: openai_usage_window
        shell: bash
        run: |
          echo "start_time=$(date +%s)" >> "${GITHUB_OUTPUT}"

      - name: Run Codex trend news research
        if: steps.run_context.outputs.article_exists != 'true' && steps.restore_generated_news_article.outputs.cache-hit != 'true'
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ops/codex/runtime/daily-trend-news-prompt.md
          output-file: codex-output.md
          safety-strategy: drop-sudo
          sandbox: workspace-write
          model: ${{ env.OPENAI_MODEL }}
          effort: medium
          allow-bots: true

      - name: Restore Node for site build
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Estimate OpenAI usage cost
        if: always() && steps.run_context.outputs.article_exists != 'true' && steps.restore_generated_news_article.outputs.cache-hit != 'true'
        continue-on-error: true
        id: openai_usage_cost
        shell: bash
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          OPENAI_USAGE_START_TIME: ${{ steps.openai_usage_window.outputs.start_time }}
          OPENAI_USAGE_MODEL: ${{ env.OPENAI_MODEL }}
          OPENAI_USAGE_OUTPUT_FILE: ${{ runner.temp }}/openai-usage-comment.md
        run: |
          set -euo pipefail

          OPENAI_USAGE_END_TIME="$(date +%s)"
          export OPENAI_USAGE_END_TIME
          node ops/scripts/estimate-openai-usage-cost.mjs
          echo "comment_path=${OPENAI_USAGE_OUTPUT_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Remove runtime prompt artifacts
        if: always()
        shell: bash
        run: |
          rm -rf ops/codex/runtime codex-output.md

      - name: Check generated news article
        id: diff_check
        shell: bash
        env:
          ARTICLE_PATH: ${{ steps.run_context.outputs.article_path }}
          SLUG: ${{ steps.run_context.outputs.slug }}
        run: |
          set -euo pipefail

          git ls-files --modified --others --exclude-standard -z -- '*.md' '*.mdx' \
            | while IFS= read -r -d '' file; do
                perl -0pi -e 's/[ \t]+$//mg; s/\n+\z/\n/s' "${file}"
              done

          mapfile -d '' changed_mdx_files < <(git ls-files --modified --others --exclude-standard -z -- '*.mdx')
          if (( ${#changed_mdx_files[@]} > 0 )); then
            pnpm exec prettier --plugin-search-dir=. --check "${changed_mdx_files[@]}"
          fi

          if [[ ! -f "${ARTICLE_PATH}" ]]; then
            echo "::error::Expected generated article was not found: ${ARTICLE_PATH}"
            exit 1
          fi

          if ! grep -qE "^contentType:[[:space:]]*['\"]?news['\"]?[[:space:]]*$" "${ARTICLE_PATH}"; then
            echo "::error::Generated article must use contentType: news"
            exit 1
          fi

          if ! grep -qE "^category:[[:space:]]*['\"]?tech-news['\"]?[[:space:]]*$" "${ARTICLE_PATH}"; then
            echo "::error::Generated article must use category: tech-news"
            exit 1
          fi

          article_title="$(
            awk '
              /^title:/ {
                sub(/^title:[[:space:]]*/, "")
                gsub(/^['\''"]|['\''"]$/, "")
                print
                exit
              }
            ' "${ARTICLE_PATH}"
          )"
          article_h1="$(awk '/^#[[:space:]]+/ { sub(/^#[[:space:]]+/, ""); print; exit }' "${ARTICLE_PATH}")"
          if [[ "${article_title}" != "${article_h1}" ]]; then
            echo "::error::News article title and H1 must match."
            exit 1
          fi
          if [[ ! "${article_title}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]].{12,}$ ]]; then
            echo "::error::News article title must be a date followed by a substantive summary phrase."
            exit 1
          fi
          for localized_article_path in "articles/news/${SLUG}"/{ja,en}/index.mdx; do
            if [[ ! -f "${localized_article_path}" ]]; then
              echo "::error file=${localized_article_path}::Generated news article must include both Japanese and English localized articles."
              exit 1
            fi
            localized_title="$(
              awk '
                /^title:/ {
                  sub(/^title:[[:space:]]*/, "")
                  gsub(/^['\''"]|['\''"]$/, "")
                  print
                  exit
                }
              ' "${localized_article_path}"
            )"
            if (( ${#localized_title} > 80 )); then
              echo "::error file=${localized_article_path}::News article titles must be 80 characters or fewer."
              exit 1
            fi

            if ! grep -qF "import NewsDigestSection from '../../../../src/components/mdx/NewsDigestSection.astro'" "${localized_article_path}"; then
              echo "::error file=${localized_article_path}::Generated localized news article must import NewsDigestSection."
              exit 1
            fi

            section_open_count="$(grep -cF "<NewsDigestSection tone=" "${localized_article_path}" || true)"
            section_close_count="$(grep -cF "</NewsDigestSection>" "${localized_article_path}" || true)"
            if (( section_open_count != 3 || section_close_count != 3 )); then
              echo "::error file=${localized_article_path}::Generated localized news article must contain exactly three balanced NewsDigestSection blocks. Found ${section_open_count} opening tags and ${section_close_count} closing tags."
              exit 1
            fi

            for localized_tone in politics economy technology; do
              localized_tone_count="$(grep -cF "<NewsDigestSection tone='${localized_tone}'>" "${localized_article_path}" || true)"
              if (( localized_tone_count != 1 )); then
                echo "::error file=${localized_article_path}::Generated localized news article must contain exactly one NewsDigestSection wrapper for ${localized_tone}."
                exit 1
              fi
            done
          done
          if [[ ! -f "articles/news/${SLUG}/mix-alignment.json" ]]; then
            echo "::error file=articles/news/${SLUG}/mix-alignment.json::Generated bilingual news must include mix-alignment.json for MIX article display."
            exit 1
          fi
          if [[ "${article_title}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]+ホットトレンド[:：][[:space:]]*政治・経済・技術$ ]]; then
            echo "::error::News article title must summarize the day's overall situation instead of listing generic categories."
            exit 1
          fi

          for heading in "## 政治" "## 経済" "## 技術"; do
            if ! grep -qF "${heading}" "${ARTICLE_PATH}"; then
              echo "::error::Generated article is missing heading: ${heading}"
              exit 1
            fi
          done

          for tone in politics economy technology; do
            if ! grep -qF "<NewsDigestSection tone='${tone}'>" "${ARTICLE_PATH}"; then
              echo "::error::Generated article is missing NewsDigestSection wrapper: ${tone}"
              exit 1
            fi
          done

          if ! grep -qF "import NewsSourceCard from '../../../../src/components/mdx/NewsSourceCard.astro'" "${ARTICLE_PATH}"; then
            echo "::error::Generated article must import NewsSourceCard for embedded source memo cards."
            exit 1
          fi

          source_card_count="$(grep -cF "<NewsSourceCard" "${ARTICLE_PATH}" || true)"
          if (( source_card_count < 15 )); then
            echo "::error::Generated article must include at least fifteen NewsSourceCard source memo cards, one per topic. Found ${source_card_count}."
            exit 1
          fi

          image_url_count="$(grep -cF "imageUrl=" "${ARTICLE_PATH}" || true)"
          if (( image_url_count < 15 )); then
            echo "::error::Generated article must include imageUrl on each NewsSourceCard. Use the source article image when reliable; otherwise use a person-, organization-, company-, location-, or event-specific Unsplash/web image. Found ${image_url_count}."
            exit 1
          fi

          image_alt_count="$(grep -cF "imageAlt=" "${ARTICLE_PATH}" || true)"
          if (( image_alt_count < 15 )); then
            echo "::error::Generated article must include imageAlt on each NewsSourceCard image. Found ${image_alt_count}."
            exit 1
          fi

          if grep -nF "imageUrl='https://source.unsplash.com/" "${ARTICLE_PATH}" || grep -nF 'imageUrl="https://source.unsplash.com/' "${ARTICLE_PATH}"; then
            echo "::error::NewsSourceCard images must use stable direct image URLs. Do not use deprecated source.unsplash.com dynamic URLs."
            exit 1
          fi

          duplicate_image_urls="$(
            awk '
              match($0, /imageUrl=(["'\''"])/) {
                quote = substr($0, RSTART + 9, 1)
                rest = substr($0, RSTART + 10)
                end = index(rest, quote)
                if (end > 0) {
                  url = substr(rest, 1, end - 1)
                  sub(/[?#].*$/, "", url)
                  count[url]++
                  if (count[url] == 2) print url
                }
              }
            ' "${ARTICLE_PATH}"
          )"
          if [[ -n "${duplicate_image_urls}" ]]; then
            echo "::error::NewsSourceCard imageUrl values must be unique within one article after removing query strings. Duplicates:"
            echo "${duplicate_image_urls}"
            exit 1
          fi

          if grep -nE "^出典メモ:" "${ARTICLE_PATH}"; then
            echo "::error::News articles must use NewsSourceCard for source memos instead of plain 出典メモ: lines."
            exit 1
          fi

          hero_query="$(
            awk '
              /^heroImageQuery:/ {
                sub(/^heroImageQuery:[[:space:]]*/, "")
                gsub(/^['\''"]|['\''"]$/, "")
                print
                exit
              }
            ' "${ARTICLE_PATH}"
          )"
          hero_query_normalized="$(tr '[:upper:]' '[:lower:]' <<< "${hero_query}")"
          if [[ "${hero_query_normalized}" =~ ^[[:space:]]*(news|daily|hot|trend|trends|headline|headlines|collage|politics|economy|technology|global|abstract|data|streams|desk|newsroom|editorial)([[:space:]]+(news|daily|hot|trend|trends|headline|headlines|collage|politics|economy|technology|global|abstract|data|streams|desk|newsroom|editorial))*[[:space:]]*$ ]]; then
            echo "::error::heroImageQuery uses a generic news collage query; use person, organization, company, location, or event-specific catch-image search terms."
            exit 1
          fi

          for category in 政治 経済 技術; do
            count="$(awk -v category="${category}" '
              $0 == "## " category { in_section = 1; next }
              in_section && /^## / { in_section = 0 }
              in_section && /^###[[:space:]]+/ { count++ }
              END { print count + 0 }
            ' "${ARTICLE_PATH}")"
            if [[ "${count}" != "5" ]]; then
              echo "::error::Generated article must include exactly five ${category} topic headings."
              exit 1
            fi
          done

          if grep -nE "^###[[:space:]]+(政治|経済|技術)[[:space:]]+[1-5]\\." "${ARTICLE_PATH}"; then
            echo "::error::Topic headings must not include category-number prefixes."
            exit 1
          fi

          if grep -nE "TBD|TODO|未定|要確認|FIXME" "${ARTICLE_PATH}"; then
            echo "::error::Generated article contains unresolved placeholders."
            exit 1
          fi

          for localized_log_path in "articles/news/${SLUG}"/{ja,en}/research-log.mdx; do
            if [[ ! -f "${localized_log_path}" ]]; then
              echo "::error file=${localized_log_path}::Generated news article must include localized research logs."
              exit 1
            fi

            if [[ "${localized_log_path}" == */ja/research-log.mdx ]]; then
              required_context_heading="## 利用環境"
              required_instruction_heading="## 調査命令"
            else
              required_context_heading="## Environment"
              required_instruction_heading="## Research Instruction"
            fi

            if ! grep -qFx "${required_context_heading}" "${localized_log_path}"; then
              echo "::error file=${localized_log_path}::Research log is missing ${required_context_heading}."
              exit 1
            fi
            if ! grep -qFx "${required_instruction_heading}" "${localized_log_path}"; then
              echo "::error file=${localized_log_path}::Research log is missing ${required_instruction_heading}."
              exit 1
            fi
          done

          # Include newly created files in diff checks without staging contents.
          git add --intent-to-add .
          git diff --check

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
          else
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Select Unsplash hero images
        if: steps.diff_check.outputs.has_changes == 'true' && steps.restore_generated_news_article.outputs.cache-hit != 'true'
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node ops/scripts/select-unsplash-hero.mjs

      - name: Verify unique hero images
        if: steps.diff_check.outputs.has_changes == 'true'
        run: pnpm test:hero-images

      - name: Verify generated mixed news alignment
        if: steps.diff_check.outputs.has_changes == 'true'
        run: node ops/scripts/validate-mix-alignment.mjs --changed

      - name: Build generated site
        if: steps.diff_check.outputs.has_changes == 'true'
        run: |
          node --version
          pnpm build

      - name: Verify generated routes
        if: steps.diff_check.outputs.has_changes == 'true'
        shell: bash
        env:
          SLUG: ${{ steps.run_context.outputs.slug }}
        run: |
          set -euo pipefail

          test -f "dist/news/index.html"
          test -f "dist/news/rss.xml"
          test -f "dist/news/${SLUG}/index.html"
          test -f "articles/news/${SLUG}/ja/research-log.mdx"
          test -f "dist/news/${SLUG}/research/index.html"
          grep -nE "利用環境|調査命令|Model|model" \
            "dist/news/${SLUG}/research/index.html"

          grep -nE "${SLUG}|ホットトレンド|政治|経済|技術" \
            "dist/news/index.html" \
            "dist/news/rss.xml" \
            "dist/news/${SLUG}/index.html"

      - name: Create generated news article cache archive
        if: steps.diff_check.outputs.has_changes == 'true' && steps.restore_generated_news_article.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/generated-news-article-cache"
          generated_files="${RUNNER_TEMP}/generated-news-files.txt"
          git ls-files --modified --others --exclude-standard -z \
            > "${generated_files}"
          tar --null -czf "${RUNNER_TEMP}/generated-news-article-cache/generated-news-article.tar.gz" \
            --files-from "${generated_files}"

      - name: Save generated news article cache
        if: steps.diff_check.outputs.has_changes == 'true' && steps.restore_generated_news_article.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/generated-news-article-cache
          key: ${{ steps.run_context.outputs.cache_key }}

      - name: Create trend news pull request
        if: steps.diff_check.outputs.has_changes == 'true'
        id: create_pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_GH_TOKEN: ${{ steps.research_app_token.outputs.token }}
          REPORT_DATE: ${{ steps.run_context.outputs.report_date }}
          SLUG: ${{ steps.run_context.outputs.slug }}
          GENERATED_NEWS_ARTICLE_CACHE_HIT: ${{ steps.restore_generated_news_article.outputs.cache-hit }}
        run: |
          set -euo pipefail

          branch="codex/daily-trend-news-${REPORT_DATE}-${GITHUB_RUN_ID}"
          base_ref_oid="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add -A
          git commit -m "Add daily trend news for ${REPORT_DATE}"
          head_ref_oid="$(git rev-parse HEAD)"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${branch}" \
            -f sha="${base_ref_oid}" \
            >/dev/null
          git push origin "HEAD:${branch}"

          pr_body="$(mktemp)"
          {
            echo "## 要約"
            echo
            echo "- ${REPORT_DATE} の政治・経済・技術トレンドを各5件ずつまとめたNews記事を追加します。"
            echo "- News一覧とNews RSSに表示される \`contentType: news\` の記事として生成しています。"
            echo
            echo "## 背景・目的"
            echo
            echo "- 日時ベースで直近のホットトレンドを継続調査し、長文レポートとは別に短いNews digestとして蓄積するためです。"
            echo
            echo "## 主な変更点"
            echo
            echo "- \`articles/news/${SLUG}/ja/index.mdx\` を追加。"
            echo "- 必要に応じてUnsplash由来のヒーロー画像を追加。"
            echo
            echo "## 確認したこと"
            echo
            echo "- [x] \`git diff --check\`"
            echo "- [x] 未解決プレースホルダ（\`TBD\`, \`TODO\`, \`未定\`, \`要確認\`, \`FIXME\`）が残っていないこと"
            echo "- [x] 重要な主張の近くに \`NewsSourceCard\` があり、各カードに関連画像が設定されていること"
            echo "- [x] News のキャッチ画像検索語が汎用ニュース語句ではなく、人物・組織・企業・場所・イベントに寄っていること"
            echo "- [x] Mermaidなどの図解がMarkdownとして読めること"
            echo "- [x] 追加・更新した \`research-log.mdx\` に調査プロセスと残課題が反映されていること、またはNews単体のため該当なし"
            echo "- [x] \`pnpm build\`"
            echo "- [x] \`dist/news/index.html\`, \`dist/news/rss.xml\`, \`dist/news/${SLUG}/index.html\` の生成確認"
            echo
            echo "## レビュー観点"
            echo
            echo "- 政治・経済・技術それぞれ5件の選定が、当日のホットトレンドとして妥当か。"
            echo "- News digestとして長すぎず、実務判断に必要な背景と含意が入っているか。"
            echo "- 出典が現在情報として十分に信頼できるか。"
            echo
            echo "## 残課題・フォローアップ"
            echo
            echo "- 翌日以降のrunで、未確定事項や継続トピックを追跡します。"
            echo
            echo "## 備考"
            echo
            echo "- Build and route verification were performed by this workflow after restoring the repository Node.js version."
            if [[ "${GENERATED_NEWS_ARTICLE_CACHE_HIT}" == "true" ]]; then
              echo "- Generated news article artifacts were restored from the date cache, so Codex generation was skipped."
            fi
          } > "${pr_body}"

          pr_url="$(GH_TOKEN="${PR_GH_TOKEN}" gh pr create \
            --title "Daily trend news: ${REPORT_DATE}" \
            --body-file "${pr_body}" \
            --base main \
            --head "${branch}")"
          pr_number="$(GH_TOKEN="${PR_GH_TOKEN}" gh pr view "${pr_url}" --json number --jq '.number')"

          {
            echo "pr_url=${pr_url}"
            echo "pr_number=${pr_number}"
            echo "branch=${branch}"
            echo "base_ref_oid=${base_ref_oid}"
            echo "head_ref_oid=${head_ref_oid}"
          } >> "${GITHUB_OUTPUT}"

      - name: Dispatch Cloudflare preview deploy
        if: steps.create_pr.outputs.pr_url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.research_app_token.outputs.token }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          PREVIEW_BRANCH: ${{ steps.create_pr.outputs.branch }}
          PREVIEW_CHECKOUT_REF: ${{ steps.create_pr.outputs.head_ref_oid }}
        run: |
          set -euo pipefail

          gh workflow run cloudflare-pages-preview.yml \
            --ref main \
            -f pr_number="${PR_NUMBER}" \
            -f preview_branch="${PREVIEW_BRANCH}" \
            -f checkout_ref="${PREVIEW_CHECKOUT_REF}"

      - name: Comment OpenAI usage on PR
        if: steps.create_pr.outputs.pr_url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.research_app_token.outputs.token }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
          OPENAI_USAGE_COMMENT: ${{ steps.openai_usage_cost.outputs.comment_path }}
        run: |
          set -euo pipefail

          if [[ -s "${OPENAI_USAGE_COMMENT}" ]]; then
            gh pr comment "${PR_URL}" --body-file "${OPENAI_USAGE_COMMENT}"
          fi

      - name: Merge completed trend news pull request
        if: steps.create_pr.outputs.pr_url != ''
        id: merge_pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.research_app_token.outputs.token }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          REPORT_DATE: ${{ steps.run_context.outputs.report_date }}
          EXPECTED_BASE_REF_OID: ${{ steps.create_pr.outputs.base_ref_oid }}
        run: |
          set -euo pipefail

          pr_json="$(gh pr view "${PR_NUMBER}" --json state,headRefOid)"
          pr_state="$(jq -r '.state' <<< "${pr_json}")"
          head_ref_oid="$(jq -r '.headRefOid' <<< "${pr_json}")"
          current_main_ref_oid="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"

          if [[ "${pr_state}" != "OPEN" ]]; then
            if [[ "${pr_state}" == "MERGED" ]]; then
              echo "PR #${PR_NUMBER} is already merged."
              exit 0
            else
              echo "::error::PR #${PR_NUMBER} is not open; current state is ${pr_state}."
              exit 1
            fi
          fi

          if [[ "${current_main_ref_oid}" != "${EXPECTED_BASE_REF_OID}" ]]; then
            echo "::error::main changed from ${EXPECTED_BASE_REF_OID} to ${current_main_ref_oid} after generation and preview. Re-run the workflow on the latest main before merging PR #${PR_NUMBER}."
            exit 1
          fi

          gh pr merge "${PR_NUMBER}" \
            --squash \
            --delete-branch \
            --match-head-commit "${head_ref_oid}" \
            --subject "Daily trend news: ${REPORT_DATE}" \
            --body "Generated, built, and merged by the Daily Trend News workflow."

      - name: Dispatch English translation workflow
        if: steps.merge_pr.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.research_app_token.outputs.token }}
        run: |
          set -euo pipefail

          gh workflow run translate-blog-en.yml --ref main
